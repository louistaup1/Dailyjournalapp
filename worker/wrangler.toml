name = "journal-push"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Every 5 minutes: checks whether a reminder or weekly recap is due.
# One run lists the stored subscriptions (one, for a single user), well
# within the free tier.
[triggers]
crons = ["*/5 * * * *"]

# Holds the push subscription and schedule only. Create it with
#   npx wrangler kv namespace create SUBS
# and paste the id it prints here.
[[kv_namespaces]]
binding = "SUBS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# The address the journal app is served from, e.g. "https://my-journal.pages.dev".
ALLOWED_ORIGIN = "REPLACE_WITH_APP_ORIGIN"
# Contact for push services (required by the VAPID spec). A mailto: or https: URL.
VAPID_SUBJECT = "mailto:you@example.com"
# Public half of the VAPID key pair (npm run vapid). The private half is a secret:
#   npx wrangler secret put VAPID_PRIVATE_KEY
VAPID_PUBLIC_KEY = "REPLACE_WITH_VAPID_PUBLIC_KEY"
